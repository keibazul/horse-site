<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서울 경주 예측</title>
<meta name="description" content="렛츠런파크 서울 경주일 현황, 경주별 우승 확률 1순위, 지난 경주 복기와 마권 기록장">
<script>/* 예전 주소(?date=…&race=…)는 경주 예측 화면으로 */ if (/[?&](date|race)=/.test(location.search)) location.replace("race.html" + location.search);</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3a2a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="경주 예측">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* 홈: 초록 머리(경주일 현황 + 경주 시간표) → 경주별 1순위 → 최근 성적 → 할 수 있는 일 */
.hero{background:var(--brand);color:var(--brand-ink);padding:22px 0 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% auto;width:620px;height:620px;border-radius:50%;
  border:56px solid rgb(255 255 255 / .035);pointer-events:none}
.hero .wrap{display:grid;gap:18px;position:relative;z-index:1}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--brand-muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--brand-muted)}
.status.live i{background:#7fe0a8;box-shadow:0 0 0 4px rgb(127 224 168 / .18)}
.status.live{color:#bdeccf}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;line-height:1.08;letter-spacing:-.035em}
.hero .sub{color:var(--brand-muted);font-size:15px;margin-top:6px}
.hero .sub b{color:var(--brand-ink);font-weight:700}
.daysw{display:flex;gap:6px;flex-wrap:wrap}
.daysw button{border:1px solid rgb(255 255 255 / .18);background:transparent;color:var(--brand-muted);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer}
.daysw button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.cta{display:flex;flex-wrap:wrap;gap:8px}
.cta .btn.primary{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink);padding:10px 18px;font-size:15px}
.cta .btn.ghost{background:transparent;color:var(--brand-ink);border-color:rgb(255 255 255 / .28);padding:10px 16px;font-size:15px}

/* 경주 시간표: 번호천처럼 생긴 칸 */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:96px;display:grid;gap:2px;align-content:start;padding:9px 10px 10px;border-radius:10px;text-decoration:none;color:inherit;
  background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .1);position:relative}
.tile:hover{background:rgb(255 255 255 / .1)}
.tile .tm{font-size:12px;color:var(--brand-muted);font-weight:700}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.tile .who{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--brand-muted);font-weight:600;min-height:21px;margin-top:4px}
.tile.next{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgb(255 255 255 / .1)}
.tile.next .tm{color:#f3d48c}
.tile .nx{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;color:var(--brand);background:#f3d48c;border-radius:4px;padding:0 5px;line-height:17px}
.tile.done{background:transparent;border-style:dashed}
.tile .hit{color:#f3d48c}

/* 경주별 1순위 */
.list{overflow:hidden}
.lrow{display:grid;grid-template-columns:64px minmax(140px,.9fr) minmax(0,2.2fr) 150px;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);
  color:inherit;text-decoration:none}
.lrow:first-child{border-top:0}
.gone summary{cursor:pointer;padding:12px 18px;border-top:1px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);list-style:none}
.gone summary::-webkit-details-marker{display:none}
.gone summary::before{content:"+ ";}
.gone[open] summary::before{content:"− ";}
.list > .gone:first-child summary{border-top:0}
.lrow:hover{background:var(--soft)}
.lrow .no b{display:block;font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.lrow .no span{font-size:12.5px;color:var(--muted);font-weight:600}
.lrow .cond{font-size:13.5px;color:var(--muted);line-height:1.4}
.lrow .cond b{color:var(--ink);font-weight:700}
.lrow .cond .c2{display:block}
.hero .sub b{white-space:nowrap}
.picks{display:grid;gap:5px;min-width:0}
.pk{display:flex;align-items:center;gap:8px;font-size:14.5px;min-width:0}
.pk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.pk .pv{font-weight:800;font-size:14px;margin-left:auto;padding-left:6px}
.pk .bar{flex:0 0 min(30%,160px);height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.pk .bar i{display:block;height:100%;background:var(--bar);border-radius:99px}
.rest{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--muted);font-size:12.5px;font-weight:600}
.rest .gap{width:6px}
.res{display:grid;justify-items:end;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.res .chips{display:flex;gap:3px}
@media (max-width:720px){
  .lrow{grid-template-columns:50px minmax(0,1fr);gap:4px 12px;padding:12px 14px}
  .lrow .cond{grid-column:2;font-size:12.5px}
  .lrow .cond .c2{display:inline;margin-left:6px}
  .lrow .picks{grid-column:2}
  .lrow .res{grid-column:2;justify-items:start;grid-auto-flow:column;justify-content:start;align-items:center}
  .lrow .res:empty{display:none}
  .lrow .no{grid-row:1 / span 3;align-self:start}
  .pk .bar{display:none}
}

/* 최근 성적 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.stat{padding:16px 18px;display:grid;gap:12px;align-content:start}
.stat h3{font-size:15px;font-weight:800}
.stat h3 small{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.meter{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.meter .lab{color:var(--muted);font-weight:600}
.meter .tr{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:99px;background:var(--bar)}
.meter.alt .tr i{background:var(--bar-mkt)}
.meter b{text-align:right;font-weight:800}
.stat .more{font-size:13.5px;font-weight:700;text-decoration:none}

/* 할 수 있는 일 */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;align-items:start}
.feat .ic{grid-row:1 / span 2;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.feat .ic svg{width:22px;height:22px}
.feat b{font-size:15.5px;font-weight:800}
.feat:hover b{color:var(--accent)}
.feat span{font-size:13.5px;color:var(--muted);line-height:1.5}
.note{font-size:13.5px;color:var(--muted)}
</style>
</head>
<body data-page="home">
<script src="assets/app.js"></script>
<main id="main">
  <section class="hero" aria-labelledby="heroH">
    <div class="wrap">
      <div>
        <p class="status" id="status"><i></i><span>불러오는 중</span></p>
        <h1 id="heroH">렛츠런파크 서울</h1>
        <p class="sub" id="heroSub"></p>
      </div>
      <div class="daysw" id="daysw" role="group" aria-label="경주일 고르기" hidden></div>
      <nav class="strip" id="strip" aria-label="경주 시간표"></nav>
      <div class="cta">
        <a class="btn primary" id="ctaRace" href="race.html">경주 예측 보기</a>
        <a class="btn ghost" href="plan.html">오늘 베팅 계획</a>
        <a class="btn ghost" href="guide.html">처음이라면: 사용법</a>
      </div>
    </div>
  </section>

  <div class="page">
    <section style="display:grid;gap:10px" aria-labelledby="listH">
      <div class="sec-title"><h2 id="listH">경주별 1순위</h2><span class="aside" id="listAside"></span></div>
      <div class="list panel" id="list"><p class="empty">불러오는 중…</p></div>
      <p class="note">확률은 경주 전 정보로 낸 모델 값입니다. 경주 직전 배당을 넣으면 예측 화면에서 배당과 섞은 확률로 바뀝니다.</p>
    </section>

    <section style="display:grid;gap:10px" aria-labelledby="statH">
      <div class="sec-title"><h2 id="statH">최근 성적</h2><span class="aside"><a href="review.html">주간 복기</a> · <a href="results.html">수익 검증</a></span></div>
      <div class="stats" id="stats"></div>
    </section>

    <section style="display:grid;gap:4px" aria-labelledby="featH">
      <div class="sec-title" style="margin-bottom:6px"><h2 id="featH">이 사이트에서 할 수 있는 일</h2></div>
      <div class="feats" id="feats"></div>
    </section>
  </div>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SADDLE = {1:["#f4f4f1","#111"],2:["#1e1e22","#fff"],3:["#d8392b","#fff"],4:["#2c66d6","#fff"],5:["#f3c533","#111"],6:["#2c9b55","#fff"],
  7:["#f08a24","#111"],8:["#e46aa3","#111"],9:["#7a4fd6","#fff"],10:["#47b9cb","#111"],11:["#8a5a3a","#fff"],12:["#b7c43a","#111"],
  13:["#3a4a8c","#fff"],14:["#c9c9c9","#111"],15:["#9b2f5e","#fff"],16:["#2f6f6f","#fff"]};
const chip = (n, cls = "sm") => { const [bg, fg] = SADDLE[n] || ["#888","#fff"]; return `<span class="chip ${cls}" style="background:${bg};color:${fg}">${n}</span>`; };
const pct = p => p >= 0.1 ? (p*100).toFixed(0) + "%" : (p*100).toFixed(1) + "%";
const DOW = "일월화수목금토";
const toDate = d => new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8));
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
const long = d => { const t = toDate(d); return `${t.getMonth()+1}월 ${t.getDate()}일 ${DOW[t.getDay()]}요일`; };
const short = d => { const t = toDate(d); return `${t.getMonth()+1}/${t.getDate()} (${DOW[t.getDay()]})`; };
const stTime = r => { const m = String(r?.stTime ?? "").match(/(\d{1,2}):?(\d{2})/); return m ? `${m[1].padStart(2,"0")}:${m[2]}` : ""; };
const mins = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h*60 + m; };
const get = u => fetch(u, {cache:"no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null);
const ICON = {
  race: '<path d="M6.5 4.5v6.8a5.5 5.5 0 0 0 11 0V4.5"/><path d="M4.5 4.5h4M15.5 4.5h4"/>',
  sim: '<path d="M4 17c2.5-5 5-7 8-7s5.5 2 8 7"/><circle cx="12" cy="10" r="2.2"/><path d="M3 20h18"/>',
  review: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/>',
  bets: '<path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.2a2.8 2.8 0 0 0 0 5.6V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.2a2.8 2.8 0 0 0 0-5.6z"/>',
  results: '<path d="M4 20h16"/><path d="M6.5 16v-4M11 16V8M15.5 16v-6M20 16V5"/>',
  plan: '<rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17"/><circle cx="16" cy="14.5" r="1.2"/><path d="M7 3.5h10"/>'
};
const ic = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

$("feats").innerHTML = [
  ["race", "race.html", "경주 예측", "출전마마다 우승 확률. 경주 직전 단승 배당을 넣으면 배당과 섞은 확률과 7가지 승식의 유력 조합을 보여 줍니다."],
  ["plan", "plan.html", "베팅 계획", "오늘 쓸 자금을 넣으면 경주마다 승식·조합·금액과 '배당이 얼마 이상일 때만 사기' 조건을 나눠 줍니다. 한 경주 10만 원 상한을 지키고, 걸 만한 조합이 없으면 건너뜁니다."],
  ["sim", "race.html", "전개 시뮬레이션", "구간 기록 모델과 물리 엔진으로 경주를 수천 번 돌려 초반 자리다툼과 막판 추입을 그림으로 봅니다. 예측 화면의 경주 카드에서 엽니다."],
  ["review", "review.html", "주간 복기", "주말이 끝나면 경주마다 예측과 실제 착순을 나란히 놓고, 크게 빗나간 경주에서 무엇이 달랐는지 정리합니다."],
  ["bets", "bets.html", "내 마권 기록장", "실제로 산 마권을 적어 두면 결과가 나온 뒤 적중, 환급, 회수율을 자동으로 계산합니다. 기록은 이 기기에만 저장됩니다."],
  ["results", "results.html", "수익 검증", "지난 1년 경주에 같은 방법으로 샀다면 얼마가 돌아왔는지, 방법별 회수율과 누적 손익입니다."],
].map(([k, h, t, d]) => `<a class="feat" href="${h}"><span class="ic">${ic(k)}</span><b>${t}</b><span>${d}</span></a>`).join("");

let INDEX, CUR;
(async () => {
  INDEX = await get("data/index.json");
  const days = INDEX?.days || [];
  if (!days.length){ $("status").innerHTML = "<i></i><span>자료 준비 중</span>"; $("list").innerHTML = `<p class="empty">아직 출전표가 나온 경주일이 없습니다. 출전표는 보통 경주 이틀 전(목요일) 저녁에 나옵니다.</p>`; return; }
  const today = ymd(new Date());
  const up = days.filter(d => d.date >= today || !d.past);
  const choices = up.length ? up : days.filter(d => d.past).slice(-1);
  if (choices.length > 1){
    $("daysw").hidden = false;
    $("daysw").innerHTML = choices.map(d => `<button type="button" data-d="${d.date}">${short(d.date)}</button>`).join("");
    $("daysw").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.d); };
  }
  stats(days);
  show(choices[0].date);
})();

async function show(date){
  CUR = date;
  [...$("daysw").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.d === date));
  const D = INDEX.days.find(d => d.date === date);
  const [ent, pred, bias] = await Promise.all([get(`data/${D.entries}`), D.pred ? get(`data/${D.pred}`) : null, get(`data/bias/${date}.json`)]);
  if (CUR !== date) return;
  const rows = ent?.rows || [];
  const races = [...new Set(rows.map(r => +r.rcNo))].sort((a, b) => a - b);
  const first = r => rows.find(x => +x.rcNo === r);
  const times = Object.fromEntries(races.map(r => [r, stTime(first(r))]));
  const today = ymd(new Date()), now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  const done = r => !!pred?.races?.[r]?.result?.length;
  const isToday = date === today, isPast = date < today;
  let next = null;
  if (isToday) next = races.find(r => !done(r) && (mins(times[r]) ?? 0) >= nowM - 2) ?? races.find(r => !done(r));
  // 머리
  const n = races.length, finished = races.filter(done).length;
  let st, live = false;
  if (isToday && next){ live = true; st = nowM >= (mins(times[races[0]]) ?? 0) ? "경주 진행 중" : `오늘 경주일 · 첫 출발 ${times[races[0]]}`; }
  else if (isToday){ st = "오늘 경주 모두 끝"; }
  else if (isPast){ st = "지난 경주일 · 다음 출전표는 보통 목요일 저녁에 나옵니다"; }
  else { const dd = Math.round((toDate(date) - toDate(today)) / 864e5); st = dd === 1 ? "내일 경주일" : `${dd}일 뒤 경주일`; }
  $("status").className = "status" + (live ? " live" : "");
  $("status").innerHTML = `<i></i><span>${esc(st)}</span>`;
  $("heroH").textContent = long(date);
  const t0 = times[races[0]], t1 = times[races[n-1]];
  $("heroSub").innerHTML = `렛츠런파크 서울 · <b>${n}경주</b>${t0 ? ` · ${t0}~${t1}` : ""}${next ? ` · 다음 출발 <b>${next}R ${times[next]}</b>` : ""}`;
  $("ctaRace").href = `race.html?date=${date}${next ? `&race=${next}` : ""}`;
  $("ctaRace").textContent = next ? `${next}경주 예측 보기` : "경주 예측 보기";
  // 경주 시간표
  const prob = r => { const p = pred?.races?.[r]?.p; if (!p) return null; const out = new Set((pred.races[r].out || []).map(String));
    const bf = bias?.races?.[r]?.f || {};
    const e = Object.entries(p).filter(([k]) => !out.has(k)).map(([k, v]) => [k, v * (bf[k] ?? 1)]); const s = e.reduce((a, [, v]) => a + v, 0); return e.map(([k, v]) => [+k, v / s]).sort((a, b) => b[1] - a[1]); };
  $("strip").innerHTML = races.map(r => {
    const P = prob(r), res = pred?.races?.[r]?.result, top = P?.[0]?.[0];
    let who;
    if (res?.length) who = `${chip(res[0])}<span class="${top === res[0] ? "hit" : ""}">${top === res[0] ? "1순위 적중" : "우승"}</span>`;
    else if (pred?.races?.[r]?.void) who = `<span>${esc(pred.races[r].void)}</span>`;
    else if (top) who = `${chip(top)}<span>1순위</span>`;
    else who = `<span>예측 전</span>`;
    return `<a class="tile ${r === next ? "next" : ""} ${res?.length ? "done" : ""}" href="race.html?date=${date}&race=${r}" aria-label="${r}경주 ${times[r]}">
      <span class="tm">${times[r] || ""}</span>${r === next ? '<span class="nx">다음</span>' : ""}<b>${r}R</b><span class="who">${who}</span></a>`;
  }).join("");
  $("strip").querySelector(".next")?.scrollIntoView({block:"nearest", inline:"center"});
  // 경주별 1순위
  $("listAside").textContent = `${short(date)} · ${pred ? (pred.races && Object.values(pred.races).some(x => x.wg) ? "당일 마체중 반영" : "경주 전 예측") : "예측 준비 중"}`;
  // 오늘: 아직 출발 안 한 경주를 위에, 끝난(출발한) 경주는 아래에 접어 둠
  const started = r => isToday && (done(r) || (mins(times[r]) ?? 9999) < nowM);
  const rowHtml = r => {
    const e = first(r), P = prob(r), pr = pred?.races?.[r] || {};
    const nm = k => rows.find(x => +x.rcNo === r && +x.chulNo === k)?.hrName || "";
    const cond = `<b>${e.rcDist ? e.rcDist + "m" : ""}</b> ${esc(e.rank || "")}<span class="c2">${esc([e.rcName && e.rcName !== "일반" ? e.rcName : "", `${rows.filter(x => +x.rcNo === r).length - (pr.out || []).length}두`].filter(Boolean).join(" · "))}</span>`;
    let picks = `<span class="muted" style="font-size:13.5px">예측 준비 중</span>`;
    if (P){
      const [a, b, c] = P;
      picks = `<div class="pk">${chip(a[0], "")}<span class="nm">${esc(nm(a[0]))}</span><span class="pv">${pct(a[1])}</span><span class="bar"><i style="width:${Math.min(100, a[1] / 0.6 * 100).toFixed(0)}%"></i></span></div>` +
        `<div class="rest"><span>2·3순위</span>${chip(b[0])}<span>${pct(b[1])}</span>${c ? `<span class="gap"></span>${chip(c[0])}<span>${pct(c[1])}</span>` : ""}</div>`;
    }
    let res = "";
    if (pr.result?.length){
      const hit = P && P[0][0] === pr.result[0];
      res = `<span class="chips">${pr.result.slice(0, 3).map(x => chip(x)).join("")}</span>${hit ? `<span class="pill gold">1순위 적중</span>` : `<span>결과</span>`}`;
    } else if (pr.void) res = `<span class="pill bad">${esc(pr.void)}</span>`;
    else if (r === next) res = `<span class="pill gold">다음 출발 ${times[r]}</span>`;
    else if (started(r)) res = `<span class="pill">출발함 · 결과는 저녁에</span>`;
    return `<a class="lrow" href="race.html?date=${date}&race=${r}"><span class="no"><b>${r}R</b><span>${times[r] || ""}</span></span>
      <span class="cond">${cond}</span><div class="picks">${picks}</div><div class="res">${res}</div></a>`;
  };
  const ahead = races.filter(r => !started(r)), gone = races.filter(started);
  $("list").innerHTML = (ahead.map(rowHtml).join("") +
    (gone.length ? `<details class="gone" ${ahead.length ? "" : "open"}><summary>${ahead.length ? `출발한 경주 ${gone.length}개` : "오늘 경주"} 보기</summary>${gone.map(rowHtml).join("")}</details>` : "")) || `<p class="empty">출전표가 없습니다.</p>`;
}

function stats(days){
  const past = days.filter(d => d.past && d.hits);
  const meter = (lab, v, n, alt) => `<div class="meter ${alt ? "alt" : ""}"><span class="lab">${lab}</span><span class="tr"><i style="width:${(v / n * 100).toFixed(1)}%"></i></span><b>${n ? (v / n * 100).toFixed(0) : 0}%</b></div>`;
  const box = (title, sub, h, more) => `<div class="stat panel"><h3>${title}<small>${sub}</small></h3><p class="note" style="margin-top:-6px">방법별 1순위 말이 실제로 이긴 비율</p>
    ${meter("모델 1순위", h.model, h.races)}${meter("배당과 결합", h.comb, h.races)}${meter("인기마", h.mkt || 0, h.races, true)}${more}</div>`;
  const out = [];
  const last = past.slice(-2);
  if (last.length){
    const h = last.reduce((a, d) => ({races: a.races + d.hits.races, model: a.model + d.hits.model, comb: a.comb + d.hits.comb, mkt: a.mkt + (d.hits.mkt || 0)}), {races:0, model:0, comb:0, mkt:0});
    out.push(box("지난 경주일", `${last.map(d => short(d.date)).join(", ")} · ${h.races}경주`, h, `<a class="more" href="review.html?date=${last[last.length-1].date}">이 주말 복기</a>`));
  }
  const T = past.reduce((a, d) => ({races: a.races + d.hits.races, model: a.model + d.hits.model, comb: a.comb + d.hits.comb, mkt: a.mkt + (d.hits.mkt || 0)}), {races:0, model:0, comb:0, mkt:0});
  if (T.races) out.push(box("최근 1년", `${past.length}일 · ${T.races}경주`, T, `<a class="more" href="results.html">수익 검증: 방법별로 샀다면 얼마가 돌아왔나, 모델 상태</a>`));
  $("stats").innerHTML = out.join("") || `<p class="empty">아직 끝난 경주일이 없습니다.</p>`;
}
})();
</script>
</body>
</html>
