name: probe-kra
# 서울출전마현황(API314)·출전표정보(API78) 확인용 (임시)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kra.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: API314, API78 조회
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
        run: |
          python - <<'EOF'
          import sys, json; sys.path.insert(0, "pipeline"); import kra_api
          kra_api.NET_FAIL_LIMIT = 99
          tests = [("API314/textDataHoldSePtinInfo", lambda d: {"race_dt": d}),
                   ("API78/chulmainfo", lambda d: {"rccrs_cd": 1, "race_dt": d})]
          for path, q in tests:
              print("########", path)
              for d in ["20261107", "20261101", "20260607", "20251102", "20241103", "20221106", "20191103"]:
                  try:
                      r = kra_api.get(path, {**q(d), "pageNo": 1, "numOfRows": 300}, timeout=60)
                      it = kra_api.items(r); print(d, "총", kra_api.total_count(r), "건")
                      if it and d in ("20261107", "20251102"):
                          for x in it[:2]: print("  ", json.dumps(x, ensure_ascii=False)[:900])
                  except Exception as e:
                      print(d, "실패:", e)
          EOF
