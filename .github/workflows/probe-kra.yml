name: probe-kra
# KRA 경마 홈페이지 '출전마체중' 상세 응답 형식 확인용 (임시)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kra.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 경주별 마체중 상세
        run: |
          UA="Mozilla/5.0 (horse-site; personal research)"
          B=https://race.kra.co.kr
          for q in "rcNo=7&date=20261101&meet=1" "rcNo=1&date=20261108&meet=1"; do
            echo "######## $q"
            curl -sS -A "$UA" -X POST -d "$q&Act=03&Sub=4" "$B/raceFastreport/ChuljumaWeightList.do" -o d.html -w "HTTP %{http_code} %{size_download}B %{content_type}\n"
            iconv -f euc-kr -t utf-8 d.html > d8.html 2>/dev/null || cp d.html d8.html
            awk '/<table/{f=1} f{print} /<\/table>/{f=0}' d8.html | sed 's/^[ \t]*//' | grep -v '^$' | head -150
            echo "== table 수: $(grep -c '<table' d8.html)"
            grep -n -i '입력\|자료가 없\|없습니다' d8.html | sed 's/^[ \t]*//' | head -5
          done
          echo "######## GET 도 되는지"
          curl -sS -A "$UA" "$B/raceFastreport/ChuljumaWeightList.do?rcNo=7&date=20261101&meet=1&Act=03&Sub=4" -o g.html -w "HTTP %{http_code} %{size_download}B\n"
          iconv -f euc-kr -t utf-8 g.html | grep -c '<tr'
