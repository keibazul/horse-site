name: probe-kra
# 경주 전 추가 정보(API314·API78) 과거 기록 모으기 (임시, 이어받기)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kra.yml']
permissions:
  contents: write
concurrency:
  group: update-site
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install pandas==3.0.5 numpy==2.5.3
      - name: 모으기 (2019년~)
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
        run: |
          cd work && python - <<'EOF'
          import zipfile; zipfile.ZipFile("merged.zip").extractall(".")
          EOF
          cd .. && python pipeline/fetch_extra.py --from 20190101 --to 20261101 --limit 1700
          ls -la work/extra
      - name: 커밋
        run: |
          git config user.name "horse-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/extra
          git diff --cached --quiet || (git commit -q -m "경주 전 추가 정보(진료·조교 등) 과거 기록" && git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main)
