name: raceday-ticker
# 경주일(토·일) 업데이트 시계: GitHub 예약 실행은 수십 분씩 늦거나 빠질 수 있어서,
# 예약은 아침·이른 오후 두 번만 걸고, 각 작업이 18:30 까지 15분마다 update-site 를 직접 실행시킨다.
# 그 뒤 18:50·19:50 에 기록 갱신까지 하는 실행으로 그날 결과·확정 배당을 받는다.
# (GITHUB_TOKEN 으로 보낸 workflow_dispatch 는 새 실행을 만든다. update-site 는 같은 묶음이라 겹치지 않는다)
on:
  schedule:
    - cron: '37 23 * * 5,6'   # 토·일 08:37 KST
    - cron: '7 5 * * 6,0'     # 토·일 14:07 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/raceday.yml']   # 이 파일을 고치면 update-site 를 한 번만 실행시켜 동작 확인

permissions:
  actions: write
  contents: read

concurrency:
  # 오후 작업이 시작되면 아침 작업은 멈춤. 파일 수정 확인용(push) 실행은 따로 묶어 돌고 있는 작업을 멈추지 않음
  group: raceday-ticker-${{ github.event_name == 'push' && 'push' || 'tick' }}
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: 15분마다 업데이트 실행 (18:30 KST 까지), 저녁 결과 받기 (18:50·19:50)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then gh workflow run update.yml -R "$REPO" --ref main -f skip_history=true && echo "확인용 1회 실행 요청 완료"; exit 0; fi
          end=$(TZ=Asia/Seoul date -d 'today 18:30' +%s)
          while [ "$(date +%s)" -lt "$end" ]; do
            echo "$(TZ=Asia/Seoul date '+%H:%M') update-site 실행"
            gh workflow run update.yml -R "$REPO" --ref main -f skip_history=true || echo "실행 요청 실패 (다음에 다시)"
            sleep 900
          done
          # 마지막 경주(17:55 무렵) 뒤: 결과·확정 배당을 받는 전체 업데이트 (기록 갱신 포함) 두 번
          for at in '18:50' '19:50'; do
            t=$(TZ=Asia/Seoul date -d "today $at" +%s); now=$(date +%s)
            [ "$t" -gt "$now" ] && sleep $((t - now))
            echo "$(TZ=Asia/Seoul date '+%H:%M') 결과 받기 실행"
            gh workflow run update.yml -R "$REPO" --ref main -f skip_history=false || echo "실행 요청 실패"
          done
          echo "오늘 경주일 업데이트 끝"
