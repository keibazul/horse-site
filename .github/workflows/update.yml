name: update-site
# 출전표 수집 → (예측 코드가 있으면) 예측·시뮬레이션 → 사이트 데이터 커밋 → GitHub Pages 배포
on:
  schedule:
    - cron: '7 9 * * 4,5'    # 목·금 18:07 (출전표 공개 후)
    - cron: '17 22 * * 5,6'  # 토·일 07:17 (경주 당일 아침)
    - cron: '17 3 * * 6,0'   # 토·일 12:17 (출전 취소 반영)
    - cron: '27 0 * * 1'     # 월 09:27 (주말 결과로 기록 갱신)
  workflow_dispatch:
    inputs:
      skip_history:
        description: '경주 기록 갱신 건너뛰기 (예측만 다시)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['pipeline/**', 'site/*.html', 'work/*.py', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: 라이브러리 설치 (예측 코드가 있을 때)
        if: hashFiles('work/site_export.py') != ''
        run: pip install -r requirements.txt
      - name: 수집·예측
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
          SKIP_HISTORY: ${{ inputs.skip_history && '1' || '0' }}
          PYTHONUTF8: '1'
        run: python pipeline/run_all.py
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "horse-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data work 2>/dev/null || git add -A site/data
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
