name: probe-div
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/checks/probe_div.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/checks/probe_div.py
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
