name: api-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 접속 테스트 3
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.error, urllib.parse
          raw = os.environ.get("KRA_API_KEY", "")
          key = raw.strip().strip('"').strip("'")
          print(f"키 길이 {len(raw)} (정리 후 {len(key)}), 앞뒤 빈칸·줄바꿈 {'있음' if raw != raw.strip() else '없음'}, "
                f"% 포함 {'예' if '%' in key else '아니오'}, + 포함 {'예' if '+' in key else '아니오'}, / 포함 {'예' if '/' in key else '아니오'}, = 포함 {'예' if '=' in key else '아니오'}")
          base = "https://apis.data.go.kr/B551015/API214_1/RaceDetailResult_1?pageNo=1&numOfRows=3&meet=1&rc_date=20261031&_type=json&serviceKey="
          tries = {"그대로": key, "변환해서(Decoding 키용)": urllib.parse.quote(key, safe=""),
                   "되돌려서 다시 변환": urllib.parse.quote(urllib.parse.unquote(key), safe="")}
          for name, k in tries.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + k, headers={"User-Agent": "Mozilla/5.0"}), timeout=30) as r:
                      print(f"{name}: 성공 HTTP {r.status} → {r.read(120).decode('utf-8','replace')}")
              except urllib.error.HTTPError as e:
                  msg = e.read(400).decode("utf-8", "replace")
                  code = "30(등록 안 된 키)" if "NOT_REGISTERED" in msg else ("22(한도 초과)" if "LIMITED" in msg else msg[:120])
                  print(f"{name}: HTTP {e.code} → {code}")
              except Exception as e:
                  print(f"{name}: 실패 → {type(e).__name__}")
          EOF
